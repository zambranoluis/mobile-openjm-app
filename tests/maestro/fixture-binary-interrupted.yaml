appId: com.openjm.mobile.fixture
---
# Host must first POST /fixture/binary/interrupt-next on the fictional service.
- runFlow: fixture-sign-in.yaml
- tapOn: "Fixture conversation"
- scrollUntilVisible:
    element: "Open conversation files"
    direction: DOWN
- tapOn: "Open conversation files"
- tapOn: "fictional-note.txt"
- scrollUntilVisible:
    element: "Save or share file"
    direction: DOWN
- tapOn: "Save or share file"
- scrollUntilVisible:
    element: "The file download was interrupted. Try downloading again."
    direction: UP
- assertVisible: "The file download was interrupted. Try downloading again."
- assertNotVisible: "Sharing.*"
- takeScreenshot: fixture-binary-interrupted
- scrollUntilVisible:
    element: "Save or share file"
    direction: DOWN
- tapOn: "Save or share file"
- assertVisible: "Sharing.*"
- takeScreenshot: fixture-binary-explicit-retry
- back
- scrollUntilVisible:
    element: "Delete file"
    direction: DOWN
- tapOn: "Delete file"
- tapOn: "Delete file"
- scrollUntilVisible:
    element: "File deletion confirmed by OpenJM."
    direction: UP
- assertVisible: "File deletion confirmed by OpenJM."
- takeScreenshot: fixture-file-deleted
